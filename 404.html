<div class="page-curtain" data-page-curtain aria-hidden="true">
  <div class="page-curtain__panel"></div>
  <span class="page-curtain__label" data-page-curtain-label>Oops</span>
</div>
<script>
  (function () {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var curtain = document.querySelector('[data-page-curtain]');
    if (!curtain) return;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        curtain.classList.add('is-leaving');
      });
    });
  })();
</script>

<header class="site-nav">
  <nav class="site-nav__pill" aria-label="Primary">
    <a href="index.html" class="site-nav__link" data-nav-link>Halo!</a>

    <a href="about.html" class="site-nav__link" data-nav-link>About</a>
  </nav>
</header>

<main>
  <section class="not-found container">
    <p class="not-found__code">404</p>
    <h1 class="not-found__heading">This page isn't ready yet</h1>
    <p class="not-found__copy">The case study you're looking for is still being written up. In the meantime, take a look at the rest of the work.</p>
    <div class="not-found__cta">
      <a class="btn btn--outline" href="index.html">Back to Home</a>
      <a class="btn btn--solid" href="work.html">See All Work</a>
    </div>
  </section>
</main>
